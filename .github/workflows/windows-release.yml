name: Windows release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build and validate the unsigned candidate
        id: package
        run: python scripts/build_windows.py
      - name: Upload validated package and scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NTFS-Compactor-v${{ steps.package.outputs.version }}-Windows-x64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep diagnostic logs when validation fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-logs
          path: build/release-validation/*.log
          if-no-files-found: ignore

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NTFS-Compactor-v${{ needs.build.outputs.version }}-Windows-x64
          path: release-assets
      - name: Create a draft release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Windows x64 folder distribution. Extract the complete ZIP and keep the `_internal` folder beside the EXE.

          Includes decompression, exclusion filters, paginated reports, adaptive batching, and corrected failure/cancellation handling.

          Native Windows tests, NTFS smoke checks, and Microsoft Defender scans must pass before this draft is created. The attached validation.json records the actual results, definition versions, and package hash.

          This candidate is unsigned because no code-signing certificate is configured. SmartScreen may show an unknown-publisher warning. A clean Defender scan is not a guarantee of acceptance by every antivirus product.
          EOF
          gh release create "v${RELEASE_VERSION}" release-assets/* \
            --target "$RELEASE_COMMIT" --draft \
            --title "NTFS Compactor v${RELEASE_VERSION} — Windows x64 candidate" \
            --notes-file release-notes.md
